services:
  # Gateway mode: full service (web UI + Telegram/Discord bots)
  assistant-gateway:
    build: .
    container_name: ai-assistant-gateway
    restart: unless-stopped
    profiles:
      - gateway
    command: ["gateway"]
    volumes:
      - assistant-workspace:/app/workspace
    ports:
      - "${GATEWAY_PORT:-18791}:18791"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  # Web mode: command center UI only (no bot channels)
  assistant-web:
    build: .
    container_name: ai-assistant-web
    restart: unless-stopped
    profiles:
      - web
    command: ["web"]
    volumes:
      - assistant-workspace:/app/workspace
    ports:
      - "${GATEWAY_PORT:-18791}:18791"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  # Agent mode: interactive CLI
  assistant-agent:
    build: .
    container_name: ai-assistant-agent
    profiles:
      - agent
    command: ["agent"]
    volumes:
      - assistant-workspace:/app/workspace
    env_file:
      - .env
    stdin_open: true
    tty: true

volumes:
  assistant-workspace:
    name: assistant-workspace
