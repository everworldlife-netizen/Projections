services:
  # Gateway mode: full service (web UI + Telegram/Discord bots)
  assistant-gateway:
    build: .
    container_name: ai-assistant-gateway
    restart: unless-stopped
    profiles:
      - gateway
    command: ["gateway", "--config", "/app/config/config.json"]
    volumes:
      - ./config/config.json:/app/config/config.json:ro
      - assistant-workspace:/app/workspace
    ports:
      - "18791:18791"
    environment:
      - PYTHONUNBUFFERED=1

  # Web mode: command center UI only (no bot channels)
  assistant-web:
    build: .
    container_name: ai-assistant-web
    restart: unless-stopped
    profiles:
      - web
    command: ["web", "--config", "/app/config/config.json"]
    volumes:
      - ./config/config.json:/app/config/config.json:ro
      - assistant-workspace:/app/workspace
    ports:
      - "18791:18791"
    environment:
      - PYTHONUNBUFFERED=1

  # Agent mode: interactive CLI
  assistant-agent:
    build: .
    container_name: ai-assistant-agent
    profiles:
      - agent
    command: ["agent", "--config", "/app/config/config.json"]
    volumes:
      - ./config/config.json:/app/config/config.json:ro
      - assistant-workspace:/app/workspace
    stdin_open: true
    tty: true

volumes:
  assistant-workspace:
    name: assistant-workspace
